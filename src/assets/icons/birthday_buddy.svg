<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Cake Frosting Gradient -->
    <linearGradient id="frostingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>

    <!-- Cake Base Gradient -->
    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#DB2777" />
    </linearGradient>

    <!-- Balloon 1 (Pink) -->
    <linearGradient id="balPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Balloon 2 (Amber) -->
    <linearGradient id="balAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Balloon 3 (Cyan) -->
    <linearGradient id="balCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>

    <!-- Filter for soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Rounded Icon Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Confetti elements -->
  <circle cx="120" cy="110" r="10" fill="#FBBF24" opacity="0.9" />
  <circle cx="390" cy="90" r="12" fill="#38BDF8" opacity="0.9" />
  <rect x="80" y="220" width="16" height="8" rx="3" fill="#EC4899" transform="rotate(35 88 224)" opacity="0.8" />
  <rect x="420" y="240" width="18" height="9" rx="3" fill="#A78BFA" transform="rotate(-25 429 244)" opacity="0.8" />
  <circle cx="100" cy="380" r="8" fill="#34D399" opacity="0.7" />
  <circle cx="410" cy="390" r="9" fill="#F43F5E" opacity="0.7" />
  <polygon points="256,60 262,75 278,78 266,90 269,106 256,98 243,106 246,90 234,78 250,75" fill="#FBBF24" />

  <!-- Background Floating Balloons -->
  <g filter="url(#shadow)">
    <!-- Cyan Balloon Left -->
    <ellipse cx="160" cy="170" rx="42" ry="54" fill="url(#balCyan)" />
    <polygon points="160,224 153,234 167,234" fill="#0284C7" />
    <path d="M160,234 Q155,270 180,310" stroke="#CBD5E1" stroke-width="2.5" fill="none" opacity="0.6" />

    <!-- Amber Balloon Right -->
    <ellipse cx="355" cy="160" rx="46" ry="58" fill="url(#balAmber)" />
    <polygon points="355,218 347,228 363,228" fill="#D97706" />
    <path d="M355,228 Q360,270 330,310" stroke="#CBD5E1" stroke-width="2.5" fill="none" opacity="0.6" />

    <!-- Pink Balloon Center-Top -->
    <ellipse cx="256" cy="140" rx="40" ry="50" fill="url(#balPink)" />
    <polygon points="256,190 249,198 263,198" fill="#BE123C" />
    <path d="M256,198 Q250,230 260,270" stroke="#CBD5E1" stroke-width="2.5" fill="none" opacity="0.6" />
  </g>

  <!-- Cake Stand -->
  <path d="M160,420 L352,420 L332,440 L180,440 Z" fill="#E2E8F0" opacity="0.9" />
  <rect x="236" y="440" width="40" height="20" rx="4" fill="#CBD5E1" />
  <rect x="200" y="456" width="112" height="12" rx="6" fill="#94A3B8" />

  <!-- Main Birthday Cake Body -->
  <g filter="url(#shadow)">
    <!-- Bottom Layer -->
    <rect x="156" y="330" width="200" height="90" rx="14" fill="url(#cakeGrad)" />

    <!-- Bottom Layer Frosting Drippings -->
    <path d="M156,345 Q176,365 196,345 Q216,365 236,345 Q256,365 276,345 Q296,365 316,345 Q336,365 356,345 L356,330 L156,330 Z" fill="url(#frostingGrad)" />

    <!-- Middle Decorative Band -->
    <rect x="156" y="375" width="200" height="10" fill="#F43F5E" opacity="0.6" />
    <circle cx="180" cy="380" r="4" fill="#FFF" />
    <circle cx="210" cy="380" r="4" fill="#FFF" />
    <circle cx="240" cy="380" r="4" fill="#FFF" />
    <circle cx="270" cy="380" r="4" fill="#FFF" />
    <circle cx="300" cy="380" r="4" fill="#FFF" />
    <circle cx="330" cy="380" r="4" fill="#FFF" />

    <!-- Top Cake Layer -->
    <rect x="186" y="260" width="140" height="70" rx="12" fill="url(#cakeGrad)" />
    <!-- Top Layer Frosting -->
    <path d="M186,275 Q203,295 221,275 Q238,295 256,275 Q273,295 291,275 Q308,295 326,275 L326,260 L186,260 Z" fill="url(#frostingGrad)" />

    <!-- Cherries / Berries on top -->
    <circle cx="206" cy="256" r="7" fill="#E11D48" />
    <circle cx="236" cy="254" r="7" fill="#E11D48" />
    <circle cx="276" cy="254" r="7" fill="#E11D48" />
    <circle cx="306" cy="256" r="7" fill="#E11D48" />
  </g>

  <!-- Candle -->
  <rect x="250" y="200" width="12" height="54" rx="4" fill="#FFF" stroke="#E2E8F0" stroke-width="1" />
  <!-- Candle Stripe -->
  <line x1="250" y1="215" x2="262" y2="210" stroke="#EC4899" stroke-width="3" />
  <line x1="250" y1="230" x2="262" y2="225" stroke="#EC4899" stroke-width="3" />
  <line x1="250" y1="245" x2="262" y2="240" stroke="#EC4899" stroke-width="3" />

  <!-- Wick -->
  <line x1="256" y1="200" x2="256" y2="190" stroke="#334155" stroke-width="2" stroke-linecap="round" />

  <!-- Flame with glow -->
  <ellipse cx="256" cy="175" rx="14" ry="18" fill="#FBBF24" opacity="0.3" filter="url(#shadow)" />
  <path d="M256,160 Q266,175 264,185 Q262,192 256,192 Q250,192 248,185 Q246,175 256,160 Z" fill="url(#flameGrad)" />
  <ellipse cx="256" cy="183" rx="4" ry="6" fill="#FFF" opacity="0.9" />
</svg>

